name: Build Velocity Racer Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VelocityRacer/**"
      - ".github/workflows/build-velocity-racer-android.yml"

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    defaults:
      run:
        working-directory: VelocityRacer
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Verify project parses
        run: godot --headless --path . --editor --quit
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/VelocityRacer.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VelocityRacer-Android-APK
          path: VelocityRacer/build/VelocityRacer.apk
          if-no-files-found: error
          retention-days: 14